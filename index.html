<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dave's Super-Awesome Bolt-Up Thing</title>
  <style>
    :root {
      --bg: #141416;
      --card-bg: #1f2024;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #32353b;
      --card-inner: #111215;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 1rem;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.5rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .form-group {
      margin-bottom: 0.75rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-inner);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
    }
    select:focus, input:focus {
      outline: 2px solid var(--accent);
    }
    .card {
      margin-top: 1rem;
      background: var(--card-inner);
      border-left: 4px solid var(--accent);
      padding: 0.85rem 1rem;
      border-radius: 0 6px 6px 0;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    .card-row:last-child { margin-bottom: 0; }
    .val {
      font-weight: bold;
      color: #fff;
      text-align: right;
    }
    .psi-highlight {
      font-size: 1.25rem;
      color: var(--accent);
    }
    .pattern-box {
      font-family: monospace;
      font-size: 0.9rem;
      color: #34d399;
      background: #090a0c;
      padding: 0.5rem;
      border-radius: 4px;
      margin-top: 0.25rem;
      word-break: break-all;
    }
    .nav-links {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      text-align: center;
    }
    .nav-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Dave's Bolt-Up Thing</h1>

  <!-- Flange Selectors -->
  <div class="grid-2">
    <div class="form-group">
      <label for="flangeSize">Nominal Pipe Size</label>
      <select id="flangeSize" onchange="updateFlangeData()"></select>
    </div>
    <div class="form-group">
      <label for="flangeClass">Flange Class / Rating</label>
      <select id="flangeClass" onchange="updateFlangeData()">
        <option value="150">150#</option>
        <option value="300">300#</option>
        <option value="600" selected>600#</option>
        <option value="900">900#</option>
        <option value="1500">1500#</option>
        <option value="2500">2500#</option>
      </select>
    </div>
  </div>

  <!-- Flange Specs Card -->
  <div class="card">
    <div class="card-title">Flange Assembly Specs (SS-30 / Jet-Lube Spec)</div>
    <div class="card-row">
      <span>Bolt / Stud Count:</span>
      <span class="val" id="boltCountDisplay">--</span>
    </div>
    <div class="card-row">
      <span>Stud Diameter:</span>
      <span class="val" id="studDiaDisplay">--</span>
    </div>
    <div class="card-row">
      <span>Heavy Hex Wrench Size:</span>
      <span class="val" id="wrenchSizeDisplay">--</span>
    </div>
    <div class="card-row">
      <span>RTJ Gasket Ring:</span>
      <span class="val" id="gasketDisplay">--</span>
    </div>
    <div class="card-row">
      <span>Target Torque:</span>
      <span class="val" id="torqueDisplay">--</span>
    </div>
    <div style="margin-top: 0.5rem;">
      <span style="font-size: 0.85rem; color: var(--text-muted);">Tightening Sequence (Star Pattern):</span>
      <div class="pattern-box" id="sequenceDisplay">--</div>
    </div>
  </div>

  <!-- Hytorc Pressure Rigging -->
  <div class="card" style="border-left-color: #3b82f6;">
    <div class="card-title" style="color: #60a5fa;">Hytorc Rigging & Pump PSI</div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="torqueInput">Torque Target (ft-lbs)</label>
        <input type="number" id="torqueInput" oninput="calculatePsi()" />
      </div>
      <div class="form-group">
        <label for="hytorcHead">Tool Model</label>
        <select id="hytorcHead" onchange="calculatePsi()">
          <option value="2-X">2-X (Stealth)</option>
          <option value="4-X" selected>4-X (Stealth)</option>
          <option value="8-X">8-X (Stealth)</option>
          <option value="2-S">2-S (Avanti / Sq-Drive)</option>
          <option value="4-S">4-S (Avanti / Sq-Drive)</option>
          <option value="8-S">8-S (Avanti / Sq-Drive)</option>
        </select>
      </div>
    </div>

    <div class="card-row" style="align-items: center; margin-top: 0.25rem;">
      <span>Required Pump Pressure:</span>
      <span class="val psi-highlight" id="psiDisplay">--</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="index.html">← Back to Index</a>
  </div>
</div>

function gcd(a, b) { return b ? gcd(b, a % b) : a; }

function decimalToFraction(val) {
  const whole = Math.floor(val);
  const remainder = val - whole;
  const sixteenths = Math.round(remainder * 16);
  if (sixteenths === 0) return whole > 0 ? `${whole}"` : `0"`;
  if (sixteenths === 16) return `${whole + 1}"`;
  const div = gcd(sixteenths, 16);
  const num = sixteenths / div;
  const den = 16 / div;
  return whole > 0 ? `${whole}-${num}/${den}"` : `${num}/${den}"`;
}

function initSizeDropdown() {
  const sizeSelect = document.getElementById("flangeSize");
  Object.keys(flangeDB).forEach(size => {
    const opt = document.createElement("option");
    opt.value = size;
    opt.innerText = `${size}" NPS`;
    if (size === "4") opt.selected = true;
    sizeSelect.appendChild(opt);
  });
  updateFlangeData();
}

function updateFlangeData() {
  const size = document.getElementById("flangeSize").value;
  const rating = document.getElementById("flangeClass").value;
  const data = flangeDB[size] && flangeDB[size][rating];

  if (!data) return;

  // Update Flange Details
  document.getElementById("boltCountDisplay").innerText = `${data.count} studs`;
  document.getElementById("studDiaDisplay").innerText = decimalToFraction(data.stud);
  document.getElementById("gasketDisplay").innerText = data.rtj;
  document.getElementById("torqueDisplay").innerText = `${data.torque} ft-lbs`;
  document.getElementById("sequenceDisplay").innerText = sequences[data.count] || "Follow standard cross-pattern";

  // Wrench Size: Stud Dia * 1.5 + 1/8" (0.125)
  const wrenchDec = (data.stud * 1.5) + 0.125;
  document.getElementById("wrenchSizeDisplay").innerText = `${decimalToFraction(wrenchDec)} (${wrenchDec.toFixed(3)}")`;

  // Pre-load target torque into Hytorc box
  document.getElementById("torqueInput").value = data.torque;
  calculatePsi();
}

function calculatePsi() {
  const targetTorque = parseFloat(document.getElementById("torqueInput").value);
  const head = document.getElementById("hytorcHead").value;

  if (isNaN(targetTorque) || targetTorque <= 0) {
    document.getElementById("psiDisplay").innerText = "Enter Torque";
    return;
  }

  const minTorque = chart[0][head];
  const maxTorque = chart[chart.length - 1][head];

  if (targetTorque < minTorque) {
    document.getElementById("psiDisplay").innerText = `< 1,500 PSI (Tool too big)`;
    return;
  }
  if (targetTorque > maxTorque) {
    document.getElementById("psiDisplay").innerText = `> 10,000 PSI (Max Exceeded)`;
    return;
  }

  for (let i = 0; i < chart.length - 1; i++) {
    const r1 = chart[i];
    const r2 = chart[i + 1];
    if (targetTorque >= r1[head] && targetTorque <= r2[head]) {
      const slope = (r2.psi - r1.psi) / (r2[head] - r1[head]);
      const calculatedPsi = Math.round(r1.psi + (targetTorque - r1[head]) * slope);
      document.getElementById("psiDisplay").innerText = `${calculatedPsi.toLocaleString()} PSI`;
      return;
    }
  }
}
