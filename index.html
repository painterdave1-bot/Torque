<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flange Bolt-Up & Hytorc PSI Calculator</title>
  <style>
    :root {
      --bg: #1e1e24;
      --card-bg: #2a2a32;
      --accent: #f59e0b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #3f3f46;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    h2 {
      margin-top: 0;
      font-size: 1.35rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.5rem;
      color: #fff;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    input, select {
      width: 100%;
      padding: 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #18181b;
      color: #fff;
      font-size: 1rem;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
    }
    .card {
      margin-top: 1.5rem;
      background: #18181b;
      border-left: 4px solid var(--accent);
      padding: 1rem;
      border-radius: 0 4px 4px 0;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
    }
    .card-row:last-child { margin-bottom: 0; }
    .val {
      font-weight: bold;
      color: #fff;
    }
    .psi-highlight {
      font-size: 1.2rem;
      color: var(--accent);
    }
    .nav-links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
    }
    .nav-links a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Bolt-Up & Hytorc Calculator</h2>

  <div class="form-group">
    <label for="studSize">Stud Diameter (Inches)</label>
    <select id="studSize" onchange="recalculate()">
      <option value="0.5">1/2"</option>
      <option value="0.625">5/8"</option>
      <option value="0.75" selected>3/4"</option>
      <option value="0.875">7/8"</option>
      <option value="1.0">1"</option>
      <option value="1.125">1-1/8"</option>
      <option value="1.25">1-1/4"</option>
      <option value="1.375">1-3/8"</option>
      <option value="1.5">1-1/2"</option>
      <option value="1.625">1-5/8"</option>
      <option value="1.75">1-3/4"</option>
      <option value="1.875">1-7/8"</option>
      <option value="2.0">2"</option>
    </select>
  </div>

  <div class="form-group">
    <label for="torqueTarget">Target Torque (ft-lbs)</label>
    <input type="number" id="torqueTarget" value="350" min="50" max="10000" oninput="recalculate()" />
  </div>

  <div class="form-group">
    <label for="headModel">Hytorc Head Model</label>
    <select id="headModel" onchange="recalculate()">
      <option value="2-X">2-X (Stealth)</option>
      <option value="4-X">4-X (Stealth)</option>
      <option value="8-X">8-X (Stealth)</option>
      <option value="2-S">2-S (Avanti / Square Drive)</option>
      <option value="4-S">4-S (Avanti / Square Drive)</option>
      <option value="8-S">8-S (Avanti / Square Drive)</option>
    </select>
  </div>

  <div class="card">
    <div class="card-row">
      <span>Heavy Hex Nut / Wrench Size:</span>
      <span class="val" id="wrenchSizeDisplay">--</span>
    </div>
    <div class="card-row">
      <span>Wrench Decimal:</span>
      <span class="val" id="wrenchDecDisplay">--</span>
    </div>
    <div class="card-row">
      <span>Required Pump Pressure:</span>
      <span class="val psi-highlight" id="psiDisplay">--</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="index.html">← Back to Overview</a>
  </div>
</div>

function gcd(a, b) {
  return b ? gcd(b, a % b) : a;
}

function decimalToFraction(val) {
  const whole = Math.floor(val);
  const remainder = val - whole;
  const sixteenths = Math.round(remainder * 16);
  
  if (sixteenths === 0) return whole > 0 ? `${whole}"` : `0"`;
  if (sixteenths === 16) return `${whole + 1}"`;

  const divisor = gcd(sixteenths, 16);
  const num = sixteenths / divisor;
  const den = 16 / divisor;

  return whole > 0 ? `${whole}-${num}/${den}"` : `${num}/${den}"`;
}

function recalculate() {
  const stud = parseFloat(document.getElementById("studSize").value);
  const targetTorque = parseFloat(document.getElementById("torqueTarget").value);
  const head = document.getElementById("headModel").value;

  // Wrench size = Stud Dia * 1.5 + 0.125 (1/8")
  const wrenchDec = (stud * 1.5) + 0.125;
  document.getElementById("wrenchSizeDisplay").innerText = decimalToFraction(wrenchDec);
  document.getElementById("wrenchDecDisplay").innerText = wrenchDec.toFixed(3) + `"`;

  // Pressure lookups
  if (isNaN(targetTorque) || targetTorque <= 0) {
    document.getElementById("psiDisplay").innerText = "Enter torque";
    return;
  }

  const minTorque = chart[0][head];
  const maxTorque = chart[chart.length - 1][head];

  if (targetTorque < minTorque) {
    document.getElementById("psiDisplay").innerText = `< 1,500 PSI (Below Range)`;
    return;
  }
  if (targetTorque > maxTorque) {
    document.getElementById("psiDisplay").innerText = `> 10,000 PSI (Max Exceeded)`;
    return;
  }

  // Linear Interpolation
  for (let i = 0; i < chart.length - 1; i++) {
    const r1 = chart[i];
    const r2 = chart[i + 1];
    if (targetTorque >= r1[head] && targetTorque <= r2[head]) {
      const slope = (r2.psi - r1.psi) / (r2[head] - r1[head]);
      const calculatedPsi = Math.round(r1.psi + (targetTorque - r1[head]) * slope);
      document.getElementById("psiDisplay").innerText = `${calculatedPsi.toLocaleString()} PSI`;
      return;
    }
  }
}

// Initial calculation on page load
window.onload = recalculate;
