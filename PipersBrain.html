<meta charset="UTF-8">

<title>Piping & Flange Field Reference</title>
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc;
  --muted: #94a3b8; --accent: #38bdf8; --row-alt: #172033;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; }
header { position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 16px; z-index: 50; }
.title { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.search-box input { width: 100%; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
.search-box input:focus { border-color: var(--accent); }
.nav-pills { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; background: #0b1120; border-bottom: 1px solid var(--border); }
.pill { padding: 6px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.pill.active { background: var(--accent); color: #0f172a; font-weight: 700; border-color: var(--accent); }
.container { padding: 16px; max-width: 1200px; margin: 0 auto; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
th, td { padding: 8px 10px; border: 1px solid #283548; white-space: nowrap; }
th { background: #0b1120; color: var(--accent); position: sticky; top: 0; }
tr:nth-child(even) { background: var(--row-alt); }
tr:hover { background: rgba(56, 189, 248, 0.08); }
.meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
.highlight { background: rgba(245, 158, 11, 0.3); color: #fbbf24; font-weight: bold; padding: 1px 3px; border-radius: 2px; }
</style>
</head>

let currentTab = "Flanges";

function render() {
  const rows = DATA[currentTab];
  document.getElementById('row-count').innerText = `${rows.length - 1} field records`;
  let html = '<table><thead><tr>';
  rows[0].forEach(h => html += `<th>${h}</th>`);
  html += '</tr></thead><tbody id="tbody">';
  for (let r = 1; r < rows.length; r++) {
    html += '<tr>';
    rows[r].forEach(c => html += `<td>${c}</td>`);
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('table-box').innerHTML = html;
}

function switchTab(name, elem) {
  currentTab = name;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  elem.classList.add('active');
  document.getElementById('search').value = '';
  render();
}

function filterActive(val) {
  const q = val.toLowerCase().trim();
  const trs = document.getElementById('tbody').getElementsByTagName('tr');
  for (let tr of trs) {
    const text = tr.textContent.toLowerCase();
    tr.style.display = text.includes(q) ? '' : 'none';
  }
}

window.onload = render;
