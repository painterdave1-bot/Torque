<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AES North Slope Contact Directory 2026</title>
<style>
  :root {
    --bg: #101317;
    --card: #181d24;
    --card-hover: #202732;
    --accent: #ff9800;
    --accent-cyan: #00e5ff;
    --accent-green: #00e676;
    --text: #e2e8f0;
    --text-muted: #8b9bb4;
    --border: #283241;
    --badge-bg: #232d3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    padding: 10px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .app-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 40px;
  }

  header { text-align: center; padding: 6px 0 2px; }
  header h1 { font-size: 1.25rem; color: var(--accent); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
  header p { font-size: 0.75rem; color: var(--text-muted); }

  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    padding: 4px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-box { position: relative; width: 100%; }
  .search-input {
    width: 100%;
    background: #181d24;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 36px 10px 12px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    padding: 4px;
  }

  .pills-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .pills-scroll::-webkit-scrollbar { display: none; }
  .pill {
    white-space: nowrap;
    background: #181d24;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .loc-filter { display: flex; gap: 6px; }
  .loc-btn {
    flex: 1;
    background: #141920;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 0;
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .loc-btn.active { background: #232d3d; color: #fff; border-color: var(--accent-cyan); }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .contacts-list { display: flex; flex-direction: column; gap: 8px; }
  .contact-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .contact-card:active { background: var(--card-hover); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-pos { font-size: 0.75rem; font-weight: 800; color: var(--accent); text-transform: uppercase; line-height: 1.2; }
  .card-sec { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
  .card-name { font-size: 0.95rem; font-weight: 700; color: #fff; }

  .comm-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .comm-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--badge-bg);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1;
  }
  .comm-btn:active { filter: brightness(1.25); }
  .comm-btn.kup { border-color: rgba(245, 158, 11, 0.4); color: #fde68a; }
  .comm-btn.alp { border-color: rgba(56, 189, 248, 0.4); color: #bae6fd; }
  .comm-btn.cell { border-color: rgba(0, 230, 118, 0.4); color: #a7f3d0; }
  .comm-btn.radio { border-color: rgba(236, 72, 153, 0.4); color: #fbcfe8; font-weight: 800; }
  .comm-btn.email { border-color: rgba(0, 229, 255, 0.4); color: #a5f3fc; }
  .comm-btn.pager { border-color: rgba(168, 85, 247, 0.4); color: #e9d5ff; }

  .tag-label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }

  .shipping-card {
    background: #151d27;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .shipping-title { font-size: 0.75rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; display: flex; justify-content: space-between; }
  .copy-btn {
    background: #38bdf822;
    border: 1px solid #38bdf866;
    color: #38bdf8;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .copy-btn:active { background: #38bdf844; }
  .shipping-body { font-size: 0.78rem; color: #cbd5e1; line-height: 1.4; }

  .no-results { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 0.85rem; font-style: italic; }
</style>
</head>

let activeDept = "ALL";
let activeLoc = "ALL";
let searchQuery = "";

const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
const contactsList = document.getElementById('contactsList');
const resultsCount = document.getElementById('resultsCount');
const pillsContainer = document.getElementById('pillsContainer');

const deptCategories = [
  { id: "ALL", label: "All Depts" },
  { id: "MAINTENANCE SERVICES -PROJECTS", label: "Maint & Projects" },
  { id: "SUPPORT SERVICES -FIELD", label: "Support Services" },
  { id: "WELLS SERVICES", label: "Wells Services" },
  { id: "MATERIAL SERVICES", label: "Materials & Logistics" },
  { id: "HSET Department", label: "HSET" },
  { id: "Operations", label: "Operations" },
  { id: "MISC.", label: "IT & Flights" }
];

deptCategories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'pill' + (cat.id === activeDept ? ' active' : '');
  btn.textContent = cat.label;
  btn.onclick = () => setDept(cat.id);
  btn.id = 'pill-' + cat.id;
  pillsContainer.appendChild(btn);
});

function setDept(dept) {
  activeDept = dept;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', p.id === 'pill-' + dept);
  });
  render();
}

function setLoc(loc) {
  activeLoc = loc;
  document.querySelectorAll('.loc-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(loc === 'ALL' ? 'All' : (loc === 'KUP' ? 'Kuparuk' : 'Alpine')));
  });
  render();
}

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  clearSearchBtn.style.display = searchQuery ? 'block' : 'none';
  render();
});

function clearSearchInput() {
  searchInput.value = '';
  searchQuery = '';
  clearSearchBtn.style.display = 'none';
  searchInput.focus();
  render();
}

function formatPhoneLink(num) {
  if (!num) return '';
  const digits = num.replace(/\D/g, '');
  if (digits.length === 7) return `tel:+1907${digits}`;
  if (digits.length === 10) return `tel:+1${digits}`;
  return `tel:${num}`;
}

function formatEmailLink(email) {
  if (!email) return '';
  if (email.includes('@')) return `mailto:${email}`;
  return `mailto:${email}@conocophillips.com`;
}

function render() {
  contactsList.innerHTML = '';

  const filtered = CONTACTS.filter(c => {
    if (activeDept !== 'ALL' && c.dept !== activeDept) return false;
    if (activeLoc === 'KUP' && !c.kup) return false;
    if (activeLoc === 'ALP' && !c.alp) return false;

    if (searchQuery) {
      const matchStr = `${c.name} ${c.pos} ${c.sec} ${c.dept} ${c.kup} ${c.alp} ${c.cell} ${c.email} ${c.pager}`.toLowerCase();
      if (!matchStr.includes(searchQuery)) return false;
    }
    return true;
  });

  resultsCount.textContent = `Showing ${filtered.length} contact${filtered.length === 1 ? '' : 's'}`;

  if (filtered.length === 0) {
    contactsList.innerHTML = `<div class="no-results">No contacts found matching "${searchQuery}".</div>`;
    return;
  }

  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'contact-card';

    let commHtml = '';

    if (c.kup) {
      commHtml += `<a href="${formatPhoneLink(c.kup)}" class="comm-btn kup">
        <span class="tag-label">KUP:</span> ${c.kup}
      </a>`;
    }

    if (c.alp) {
      commHtml += `<a href="${formatPhoneLink(c.alp)}" class="comm-btn alp">
        <span class="tag-label">ALP:</span> ${c.alp}
      </a>`;
    }

    if (c.cell) {
      if (c.cell.toLowerCase().includes('ch')) {
        commHtml += `<span class="comm-btn radio">
          <span class="tag-label">📻</span> ${c.cell}
        </span>`;
      } else {
        commHtml += `<a href="${formatPhoneLink(c.cell)}" class="comm-btn cell">
          <span class="tag-label">CELL:</span> ${c.cell}
        </a>`;
      }
    }

    if (c.email) {
      const isCOP = !c.email.includes('@');
      commHtml += `<a href="${formatEmailLink(c.email)}" class="comm-btn email">
        <span class="tag-label">${isCOP ? 'COP ID:' : '✉:'}</span> ${c.email}
      </a>`;
    }

    if (c.pager) {
      commHtml += `<span class="comm-btn pager">
        <span class="tag-label">PAGER:</span> ${c.pager}
      </span>`;
    }

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-pos">${c.pos}</div>
          <div class="card-sec">${c.sec !== c.dept ? c.sec + ' • ' : ''}${c.dept}</div>
        </div>
      </div>
      <div class="card-name">${c.name}</div>
      <div class="comm-grid">${commHtml}</div>
    `;

    contactsList.appendChild(card);
  });
}

function copyAddress() {
  const txt = `[Your Full Name]
c/o COPA GKA or COPA WNS
700 G Street
Anchorage, AK 99501`;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Address'; }, 2000);
  });
}

render();
