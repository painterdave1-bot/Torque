<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AES & COPA North Slope Directory 2026</title>
<style>
  :root {
    --bg: #101317;
    --card: #181d24;
    --card-hover: #202732;
    --text: #e2e8f0;
    --text-muted: #8b9bb4;
    --border: #283241;
    --badge-bg: #232d3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    padding: 10px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .app-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 40px;
  }

  /* Top View Navigation Tabs */
  .view-switch {
    display: flex;
    background: #141920;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
    margin-top: 2px;
  }
  .view-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 4px;
    font-size: 0.8rem;
    font-weight: 800;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .view-btn.active {
    background: #232d3d;
    color: #fff;
    border: 1px solid #00e5ff;
    box-shadow: 0 2px 8px rgba(0, 229, 255, 0.2);
  }
  .view-btn:active {
    filter: brightness(1.2);
  }

  header { text-align: center; padding: 2px 0; }
  header h1 { font-size: 1.25rem; color: #ff9800; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; transition: color 0.2s; }
  header p { font-size: 0.72rem; color: var(--text-muted); }

  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    padding: 4px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-box { position: relative; width: 100%; }
  .search-input {
    width: 100%;
    background: #181d24;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 36px 10px 12px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: #ff9800; }
  .clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    padding: 4px;
  }

  /* Balanced Grid Button Layouts */
  .pills-grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .pills-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .pill {
    width: 100%;
    background: #181d24;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 3px;
    border-radius: 8px;
    font-size: 0.7rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill:active { filter: brightness(1.2); }

  /* Field Theme Colors */
  .pill.pill-all { border-color: #475569; color: #cbd5e1; }
  .pill.pill-all.active { background: #cbd5e1; color: #0f172a; border-color: #cbd5e1; }

  .pill.pill-copa { border-color: #ef4444; color: #fca5a5; background: #3b0707; }
  .pill.pill-copa.active { background: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

  .pill.pill-maint { border-color: #f59e0b; color: #fde68a; background: #381a03; }
  .pill.pill-maint.active { background: #f59e0b; color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

  .pill.pill-support { border-color: #10b981; color: #a7f3d0; background: #042f2e; }
  .pill.pill-support.active { background: #10b981; color: #000; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

  .pill.pill-materials { border-color: #a855f7; color: #e9d5ff; background: #2e1065; }
  .pill.pill-materials.active { background: #a855f7; color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

  .pill.pill-hset { border-color: #ec4899; color: #fbcfe8; background: #4a0429; }
  .pill.pill-hset.active { background: #ec4899; color: #fff; box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }

  .pill.pill-ops { border-color: #38bdf8; color: #bae6fd; background: #082f49; }
  .pill.pill-ops.active { background: #38bdf8; color: #000; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

  .pill.pill-misc { border-color: #64748b; color: #e2e8f0; background: #1e293b; }
  .pill.pill-misc.active { background: #64748b; color: #fff; }

  /* External Theme Colors */
  .pill.pill-ext-all { border-color: #475569; color: #cbd5e1; }
  .pill.pill-ext-all.active { background: #cbd5e1; color: #0f172a; border-color: #cbd5e1; }

  .pill.pill-ext-hr { border-color: #38bdf8; color: #bae6fd; background: #082f49; }
  .pill.pill-ext-hr.active { background: #38bdf8; color: #000; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

  .pill.pill-ext-ben { border-color: #10b981; color: #a7f3d0; background: #042f2e; }
  .pill.pill-ext-ben.active { background: #10b981; color: #000; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

  .pill.pill-ext-hset { border-color: #f59e0b; color: #fde68a; background: #381a03; }
  .pill.pill-ext-hset.active { background: #f59e0b; color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

  .pill.pill-ext-ops { border-color: #a855f7; color: #e9d5ff; background: #2e1065; }
  .pill.pill-ext-ops.active { background: #a855f7; color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

  .pill.pill-ext-inbox { border-color: #ec4899; color: #fbcfe8; background: #4a0429; }
  .pill.pill-ext-inbox.active { background: #ec4899; color: #fff; box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }

  /* Location filter */
  .loc-filter { display: flex; gap: 6px; }
  .loc-btn {
    flex: 1;
    background: #141920;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 0;
    font-size: 0.72rem;
    font-weight: 800;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .loc-btn.active { background: #232d3d; color: #fff; border-color: #00e5ff; }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .contacts-list { display: flex; flex-direction: column; gap: 8px; }
  .contact-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .contact-card:active { background: var(--card-hover); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-pos { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; line-height: 1.25; }

  .card-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
  .card-notes { font-size: 0.73rem; color: #94a3b8; font-style: italic; line-height: 1.35; padding-top: 2px; }

  .comm-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .comm-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--badge-bg);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1;

    background: #38bdf822;

    padding: 2px 8px;
    border-radius: 4px;

  }
  .copy-btn:active { background: #38bdf844; }
  .shipping-body { font-size: 0.78rem; color: #cbd5e1; line-height: 1.4; }

  .no-results { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 0.85rem; font-style: italic; }
</style>
