<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AES & COPA North Slope Directory 2026</title>
<style>
  :root {
    --bg: #101317;
    --card: #181d24;
    --card-hover: #202732;
    --text: #e2e8f0;
    --text-muted: #8b9bb4;
    --border: #283241;
    --badge-bg: #232d3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    padding: 10px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .app-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 40px;
  }

  /* Top View Navigation Tabs */
  .view-switch {
    display: flex;
    background: #141920;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
    margin-top: 2px;
  }
  .view-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 4px;
    font-size: 0.8rem;
    font-weight: 800;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .view-btn.active {
    background: #232d3d;
    color: #fff;
    border: 1px solid #00e5ff;
    box-shadow: 0 2px 8px rgba(0, 229, 255, 0.2);
  }
  .view-btn:active {
    filter: brightness(1.2);
  }

  header { text-align: center; padding: 2px 0; }
  header h1 { font-size: 1.25rem; color: #ff9800; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; transition: color 0.2s; }
  header p { font-size: 0.72rem; color: var(--text-muted); }

  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    padding: 4px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-box { position: relative; width: 100%; }
  .search-input {
    width: 100%;
    background: #181d24;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 36px 10px 12px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: #ff9800; }
  .clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    padding: 4px;
  }

  /* Balanced Grid Button Layouts */
  .pills-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .pill {
    width: 100%;
    background: #181d24;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 4px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill:active { filter: brightness(1.2); }

  /* Field Theme Colors */
  .pill.pill-all { border-color: #475569; color: #cbd5e1; }
  .pill.pill-all.active { background: #cbd5e1; color: #0f172a; border-color: #cbd5e1; }

  .pill.pill-copa { border-color: #ef4444; color: #fca5a5; background: #3b0707; }
  .pill.pill-copa.active { background: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

  .pill.pill-maint { border-color: #f59e0b; color: #fde68a; background: #381a03; }
  .pill.pill-maint.active { background: #f59e0b; color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

  .pill.pill-support { border-color: #10b981; color: #a7f3d0; background: #042f2e; }
  .pill.pill-support.active { background: #10b981; color: #000; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

  .pill.pill-wells { border-color: #06b6d4; color: #a5f3fc; background: #083344; }
  .pill.pill-wells.active { background: #06b6d4; color: #000; box-shadow: 0 0 10px rgba(6, 182, 212, 0.4); }

  .pill.pill-materials { border-color: #a855f7; color: #e9d5ff; background: #2e1065; }
  .pill.pill-materials.active { background: #a855f7; color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

  .pill.pill-hset { border-color: #ec4899; color: #fbcfe8; background: #4a0429; }
  .pill.pill-hset.active { background: #ec4899; color: #fff; box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }

  .pill.pill-ops { border-color: #38bdf8; color: #bae6fd; background: #082f49; }
  .pill.pill-ops.active { background: #38bdf8; color: #000; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

  .pill.pill-misc { border-color: #64748b; color: #e2e8f0; background: #1e293b; }
  .pill.pill-misc.active { background: #64748b; color: #fff; }

  /* External Theme Colors */
  .pill.pill-ext-all { border-color: #475569; color: #cbd5e1; }
  .pill.pill-ext-all.active { background: #cbd5e1; color: #0f172a; border-color: #cbd5e1; }

  .pill.pill-ext-hr { border-color: #38bdf8; color: #bae6fd; background: #082f49; }
  .pill.pill-ext-hr.active { background: #38bdf8; color: #000; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

  .pill.pill-ext-ben { border-color: #10b981; color: #a7f3d0; background: #042f2e; }
  .pill.pill-ext-ben.active { background: #10b981; color: #000; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

  .pill.pill-ext-hset { border-color: #f59e0b; color: #fde68a; background: #381a03; }
  .pill.pill-ext-hset.active { background: #f59e0b; color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

  .pill.pill-ext-ops { border-color: #a855f7; color: #e9d5ff; background: #2e1065; }
  .pill.pill-ext-ops.active { background: #a855f7; color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

  .pill.pill-ext-inbox { border-color: #ec4899; color: #fbcfe8; background: #4a0429; }
  .pill.pill-ext-inbox.active { background: #ec4899; color: #fff; box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }

  /* Location filter */
  .loc-filter { display: flex; gap: 6px; }
  .loc-btn {
    flex: 1;
    background: #141920;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 0;
    font-size: 0.72rem;
    font-weight: 800;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;

  .loc-btn.active { background: #232d3d; color: #fff; border-color: #00e5ff; }

  .stats-bar {

    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0 4px;

  .contacts-list { display: flex; flex-direction: column; gap: 8px; }
  .contact-card {

    border: 1px solid var(--border);
    border-radius: 8px;

  .comm-btn {

  .shipping-body { font-size: 0.78rem; color: #cbd5e1; line-height: 1.4; }

// Department Config for Field Ops
const FIELD_DEPT_CONFIG = {
  "ALL": { label: "All Depts", color: "#cbd5e1", cls: "pill-all" },
  "COPA": { label: "★ COPA", color: "#ef4444", cls: "pill-copa" },
  "MAINTENANCE SERVICES -PROJECTS": { label: "Maint & Projects", color: "#f59e0b", cls: "pill-maint" },
  "SUPPORT SERVICES -FIELD": { label: "Support Services", color: "#10b981", cls: "pill-support" },
  "WELLS SERVICES": { label: "Wells Services", color: "#06b6d4", cls: "pill-wells" },
  "MATERIAL SERVICES": { label: "Materials & Logistics", color: "#a855f7", cls: "pill-materials" },
  "HSET Department": { label: "HSET", color: "#ec4899", cls: "pill-hset" },
  "Operations": { label: "Operations", color: "#38bdf8", cls: "pill-ops" },
  "MISC.": { label: "IT & Flights", color: "#94a3b8", cls: "pill-misc" }
};

// Department Config for External AES (6 balanced buttons)
const EXT_DEPT_CONFIG = {
  "ALL": { label: "All External", color: "#cbd5e1", cls: "pill-ext-all" },
  "HR & Recruiting": { label: "HR & Recruiting", color: "#38bdf8", cls: "pill-ext-hr" },
  "Benefits & Support": { label: "Benefits & Support", color: "#10b981", cls: "pill-ext-ben" },
  "Corporate QHSET": { label: "Corp QHSET", color: "#f59e0b", cls: "pill-ext-hset" },
  "Other Sites & Ops": { label: "Other Sites & Ops", color: "#a855f7", cls: "pill-ext-ops" },
  "Shared Inboxes": { label: "Shared Inboxes", color: "#ec4899", cls: "pill-ext-inbox" }
};

let currentView = "FIELD"; // "FIELD" or "EXTERNAL"
let activeFieldDept = "ALL";
let activeExtDept = "ALL";
let activeLoc = "ALL";
let searchQuery = "";

const appTitle = document.getElementById('appTitle');
const appSubtitle = document.getElementById('appSubtitle');
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
const contactsList = document.getElementById('contactsList');
const resultsCount = document.getElementById('resultsCount');
const locFilter = document.getElementById('locFilter');
const fieldPills = document.getElementById('fieldPills');
const extPills = document.getElementById('extPills');
const shippingCard = document.getElementById('shippingCard');
const btnViewField = document.getElementById('btnViewField');
const btnViewExt = document.getElementById('btnViewExt');

// Build Field Pills
Object.keys(FIELD_DEPT_CONFIG).forEach(key => {
  const cfg = FIELD_DEPT_CONFIG[key];
  const btn = document.createElement('button');
  btn.className = `pill ${cfg.cls}` + (key === activeFieldDept ? ' active' : '');
  btn.textContent = cfg.label;
  btn.onclick = () => setFieldDept(key);
  btn.id = 'fpill-' + key.replace(/[^a-zA-Z0-9]/g, '');
  fieldPills.appendChild(btn);
});

// Build External Pills
Object.keys(EXT_DEPT_CONFIG).forEach(key => {
  const cfg = EXT_DEPT_CONFIG[key];
  const btn = document.createElement('button');
  btn.className = `pill ${cfg.cls}` + (key === activeExtDept ? ' active' : '');
  btn.textContent = cfg.label;
  btn.onclick = () => setExtDept(key);
  btn.id = 'epill-' + key.replace(/[^a-zA-Z0-9]/g, '');
  extPills.appendChild(btn);
});

function switchView(view) {
  currentView = view;
  clearSearchInput();

  if (view === 'FIELD') {
    btnViewField.classList.add('active');
    btnViewExt.classList.remove('active');
    appTitle.textContent = "AES & COPA North Slope Directory";
    appSubtitle.textContent = "2026 Kuparuk & Alpine Operations & Maintenance";
    searchInput.placeholder = "Search name, position, extension, COP ID...";
    locFilter.style.display = "flex";
    fieldPills.style.display = "grid";
    extPills.style.display = "none";
    shippingCard.style.display = "flex";
  } else {
    btnViewExt.classList.add('active');
    btnViewField.classList.remove('active');
    appTitle.textContent = "AES External & Corporate Directory";
    appSubtitle.textContent = "HR, Benefits, Corporate QHSET, Other Sites & Shared Inboxes";
    searchInput.placeholder = "Search HR, recruiter, benefits, site, email, inbox...";
    locFilter.style.display = "none";
    fieldPills.style.display = "none";
    extPills.style.display = "grid";
    shippingCard.style.display = "none";
  }
  render();
}

function setFieldDept(dept) {
  activeFieldDept = dept;
  document.querySelectorAll('#fieldPills .pill').forEach(p => {
    const targetId = 'fpill-' + dept.replace(/[^a-zA-Z0-9]/g, '');
    p.classList.toggle('active', p.id === targetId);
  });
  render();
}

function setExtDept(dept) {
  activeExtDept = dept;
  document.querySelectorAll('#extPills .pill').forEach(p => {
    const targetId = 'epill-' + dept.replace(/[^a-zA-Z0-9]/g, '');
    p.classList.toggle('active', p.id === targetId);
  });
  render();
}

function setLoc(loc) {
  activeLoc = loc;
  document.querySelectorAll('.loc-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(loc === 'ALL' ? 'All' : (loc === 'KUP' ? 'Kuparuk' : 'Alpine')));
  });
  render();
}

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  clearSearchBtn.style.display = searchQuery ? 'block' : 'none';
  render();
});

function clearSearchInput() {
  searchInput.value = '';
  searchQuery = '';
  clearSearchBtn.style.display = 'none';
  searchInput.focus();
  render();
}

function formatPhoneLink(num) {
  if (!num) return '';
  const digits = num.replace(/\D/g, '');
  if (digits.length === 7) return `tel:+1907${digits}`;
  if (digits.length === 10) return `tel:+1${digits}`;
  if (digits.length === 11 && digits.startsWith('1')) return `tel:+${digits}`;
  return `tel:${num}`;
}

function formatEmailLink(email) {
  if (!email) return '';
  if (email.includes('@')) return `mailto:${email}`;
  return `mailto:${email}@conocophillips.com`;
}

function render() {
  contactsList.innerHTML = '';

  if (currentView === 'FIELD') {
    renderFieldContacts();
  } else {
    renderExternalContacts();
  }
}

function renderFieldContacts() {
  const filtered = FIELD_CONTACTS.filter(c => {
    if (activeFieldDept !== 'ALL' && c.dept !== activeFieldDept) return false;
    if (activeLoc === 'KUP' && !c.kup) return false;
    if (activeLoc === 'ALP' && !c.alp) return false;

    if (searchQuery) {
      const matchStr = `${c.name} ${c.pos} ${c.sec} ${c.dept} ${c.kup} ${c.alp} ${c.cell} ${c.email} ${c.pager}`.toLowerCase();
      if (!matchStr.includes(searchQuery)) return false;
    }
    return true;
  });

  resultsCount.textContent = `Showing ${filtered.length} field contact${filtered.length === 1 ? '' : 's'}`;

  if (filtered.length === 0) {
    contactsList.innerHTML = `<div class="no-results">No field contacts found matching "${searchQuery}".</div>`;
    return;
  }

  filtered.forEach(c => {
    const deptCfg = FIELD_DEPT_CONFIG[c.dept] || { color: '#ff9800' };
    const card = document.createElement('div');
    card.className = 'contact-card';
    card.style.borderLeft = `4px solid ${deptCfg.color}`;

    let commHtml = '';

    if (c.kup) {
      if (c.kup.includes(' / ')) {
        const parts = c.kup.split(' / ');
        parts.forEach(p => {
          commHtml += `<a href="${formatPhoneLink(p)}" class="comm-btn kup">
            <span class="tag-label">KUP:</span> ${p}
          </a>`;
        });
      } else {
        commHtml += `<a href="${formatPhoneLink(c.kup)}" class="comm-btn kup">
          <span class="tag-label">KUP:</span> ${c.kup}
        </a>`;
      }
    }

    if (c.alp) {
      if (c.alp.includes(' / ')) {
        const parts = c.alp.split(' / ');
        parts.forEach(p => {
          commHtml += `<a href="${formatPhoneLink(p)}" class="comm-btn alp">
            <span class="tag-label">ALP:</span> ${p}
          </a>`;
        });
      } else {
        commHtml += `<a href="${formatPhoneLink(c.alp)}" class="comm-btn alp">
          <span class="tag-label">ALP:</span> ${c.alp}
        </a>`;
      }
    }

    if (c.cell) {
      if (c.cell === 'MS Teams') {
        commHtml += `<span class="comm-btn teams">
          <span class="tag-label">💻</span> MS Teams
        </span>`;
      } else if (c.cell.toLowerCase().includes('ch')) {
        commHtml += `<span class="comm-btn radio">
          <span class="tag-label">📻</span> ${c.cell}
        </span>`;
      } else {
        commHtml += `<a href="${formatPhoneLink(c.cell)}" class="comm-btn cell">
          <span class="tag-label">DIRECT:</span> ${c.cell}
        </a>`;
      }
    }

    if (c.email) {
      const isCOP = !c.email.includes('@');
      commHtml += `<a href="${formatEmailLink(c.email)}" class="comm-btn email">
        <span class="tag-label">${isCOP ? 'COP ID:' : '✉:'}</span> ${c.email}
      </a>`;
    }

    if (c.pager) {
      commHtml += `<span class="comm-btn pager">
        <span class="tag-label">PAGER:</span> ${c.pager}
      </span>`;
    }

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-pos" style="color: ${deptCfg.color};">${c.pos}</div>
          <div class="card-sec"><span style="color:${deptCfg.color}; font-weight:700;">${c.dept === 'COPA' ? 'COPA' : ''}</span> ${c.sec !== c.dept ? (c.dept === 'COPA' ? '• ' : '') + c.sec + ' • ' : ''}${c.dept !== 'COPA' ? c.dept : ''}</div>
        </div>
      </div>
      <div class="card-name">${c.name}</div>
      <div class="comm-grid">${commHtml}</div>
    `;

    contactsList.appendChild(card);
  });
}

function renderExternalContacts() {
  const filtered = EXT_CONTACTS.filter(c => {
    if (activeExtDept !== 'ALL' && c.group !== activeExtDept) return false;

    if (searchQuery) {
      const matchStr = `${c.name} ${c.pos} ${c.sec} ${c.group} ${c.phone} ${c.cell} ${c.email} ${c.notes}`.toLowerCase();
      if (!matchStr.includes(searchQuery)) return false;
    }
    return true;
  });

  resultsCount.textContent = `Showing ${filtered.length} external contact${filtered.length === 1 ? '' : 's'}`;

  if (filtered.length === 0) {
    contactsList.innerHTML = `<div class="no-results">No external contacts found matching "${searchQuery}".</div>`;
    return;
  }

  filtered.forEach(c => {
    const deptCfg = EXT_DEPT_CONFIG[c.group] || { color: '#38bdf8' };
    const card = document.createElement('div');
    card.className = 'contact-card';
    card.style.borderLeft = `4px solid ${deptCfg.color}`;

    let commHtml = '';

    if (c.phone) {
      if (c.phone.includes('\n') || c.phone.includes(' / ')) {
        const parts = c.phone.split(/[\n/]/).map(s => s.trim()).filter(Boolean);
        parts.forEach(p => {
          commHtml += `<a href="${formatPhoneLink(p)}" class="comm-btn phone">
            <span class="tag-label">PHONE:</span> ${p}
          </a>`;
        });
      } else {
        commHtml += `<a href="${formatPhoneLink(c.phone)}" class="comm-btn phone">
          <span class="tag-label">PHONE:</span> ${c.phone}
        </a>`;
      }
    }

    if (c.cell) {
      if (c.cell.includes('\n') || c.cell.includes(' / ')) {
        const parts = c.cell.split(/[\n/]/).map(s => s.trim()).filter(Boolean);
        parts.forEach(p => {
          commHtml += `<a href="${formatPhoneLink(p)}" class="comm-btn cell">
            <span class="tag-label">CELL:</span> ${p}
          </a>`;
        });
      } else {
        commHtml += `<a href="${formatPhoneLink(c.cell)}" class="comm-btn cell">
          <span class="tag-label">CELL:</span> ${c.cell}
        </a>`;
      }
    }

    if (c.email) {
      if (c.email.includes('\n')) {
        const emails = c.email.split('\n').map(s => s.trim()).filter(Boolean);
        emails.forEach(em => {
          commHtml += `<a href="${formatEmailLink(em)}" class="comm-btn email">
            <span class="tag-label">✉:</span> ${em}
          </a>`;
        });
      } else {
        commHtml += `<a href="${formatEmailLink(c.email)}" class="comm-btn email">
          <span class="tag-label">✉:</span> ${c.email}
        </a>`;
      }
    }

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-pos" style="color: ${deptCfg.color};">${c.pos}</div>
          <div class="card-sec">${c.sec} • <span style="color:${deptCfg.color}; font-weight:700;">${c.group}</span></div>
        </div>
      </div>
      <div class="card-name">${c.name}</div>
      ${c.notes ? `<div class="card-notes">${c.notes}</div>` : ''}
      <div class="comm-grid">${commHtml}</div>
    `;

    contactsList.appendChild(card);
  });
}

function copyAddress() {
  const txt = `[Your Full Name]\nc/o COPA GKA or COPA WNS\n700 G Street\nAnchorage, AK 99501`;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Address'; }, 2000);
  });
}

render();
